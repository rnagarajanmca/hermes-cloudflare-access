[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cloudflare-access"
version = "0.1.0"
description = "Hermes Agent dashboard auth provider that trusts Cloudflare Access (Zero Trust) JWTs."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "hermes-cloudflare-access maintainers" },
]
keywords = [
    "hermes",
    "hermes-agent",
    "cloudflare",
    "cloudflare-access",
    "cloudflare-zero-trust",
    "dashboard-auth",
    "jwt",
    "sso",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "build>=1.0",
    "ruff>=0.4",
]
# Note: a `dev` extra for installing against a local hermes-agent checkout is
# intentionally NOT published — PEP 508 forbids git+ direct references in
# uploaded metadata. See CONTRIBUTING.md for the local dev install procedure.

[project.urls]
"Source" = "https://github.com/rnagarajanmca/hermes-cloudflare-access"
"Bug Tracker" = "https://github.com/rnagarajanmca/hermes-cloudflare-access/issues"
"Changelog" = "https://github.com/rnagarajanmca/hermes-cloudflare-access/blob/main/CHANGELOG.md"
"Security" = "https://github.com/rnagarajanmca/hermes-cloudflare-access/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hermes_cloudflare_access" = ["plugin.yaml"]
